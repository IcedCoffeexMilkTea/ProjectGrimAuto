name: Mobile APK Compilation Pipeline
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: System Dependencies Installation
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk build-essential libffi-dev libssl-dev git zip unzip
          
      - name: Install Buildozer and Kivy Dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer kivy Cython
          
      - name: Generate Airtight Spec Configuration File
        run: |
          cat << 'EOF' > buildozer.spec
          [app]
          title = GrimAuto
          package.name = grimauto
          package.domain = org.icedcoffeemilktea
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 1.0.0
          requirements = python3,kivy
          orientation = portrait
          osx.kivy_version = 2.3.0
          fullscreen = 1
          android.archs = arm64-v8a, armeabi-v7a
          android.allow_backup = True
          android.accept_sdk_license = True
          android.skip_update = False
          android.logcat_filters = *:S python:D
          
          # Force compatibility with Ubuntu Virtual Environment paths
          android.api = 33
          android.minapi = 21
          android.ndk = 25.2.9519653
          
          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF
          
      - name: Automated Binary Build Campaign
        run: |
          buildozer android debug
          
      - name: Upload Finished APK Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GrimAutoPackage
          path: bin/*.apk
