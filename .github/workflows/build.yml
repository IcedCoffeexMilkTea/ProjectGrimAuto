name: Mobile APK Compilation Pipeline
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: System Dependencies Installation
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk build-essential libffi-dev libssl-dev
      - name: Install Buildozer and Kivy
        run: |
          pip install --upgrade pip
          pip install buildozer kivy Cython
      - name: Initialize Buildozer Spec Config
        run: |
          buildozer init
          sed -i 's/# requirements = kivy/requirements = kivy/g' buildozer.spec
          sed -i 's/package.name = myapp/package.name = grimauto/g' buildozer.spec
      - name: Automated Binary Build Campaign
        run: buildozer android debug
      - name: Upload Finished APK Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GrimAutoPackage
          path: bin/*.apk
